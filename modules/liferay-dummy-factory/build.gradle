apply plugin: 'jacoco'

dependencies {
	compileOnly group: "com.liferay.portal", name: "release.dxp.api"

	compileInclude group: "net.datafaker", name: "datafaker", version: "2.7.0"

	testImplementation group: "com.liferay.portal", name: "release.dxp.api"
	testImplementation platform(group: "org.junit", name: "junit-bom", version: "5.14.4")
	testImplementation group: "org.junit.jupiter", name: "junit-jupiter"

	// JUnit 5.12+ needs a launcher matching the engine; Gradle 8.5's bundled one is older.
	testRuntimeOnly group: "org.junit.platform", name: "junit-platform-launcher"

	// DXP release.dxp.api does not bundle log4j; provide it for the test JVM
	// so Liferay's Log4jLogFactoryImpl static init can resolve LogManager.
	testRuntimeOnly group: "org.apache.logging.log4j", name: "log4j-core", version: "2.26.1"
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jacoco {
	toolVersion = '0.8.15'
}

test {
	useJUnitPlatform()
	jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
		'--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
		'--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
		'--add-opens=java.base/java.util=ALL-UNNAMED'
}

test.finalizedBy jacocoTestReport

task copyJarToLatest(type: Copy) {
	from jar.archiveFile
	into "${rootProject.projectDir}/latest"
	rename { 'liferay-dummy-factory.jar' }
}

jacocoTestReport {
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}
